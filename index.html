<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LADAYCIA Engineering - Mobile Diagnostics</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --border-color: rgba(56, 189, 248, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg-dark); color: #f8fafc; overflow: hidden; height: 100vh; }

        /* HUD Header */
        .hud-header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .brand-title h1 {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 1.8s infinite;
        }

        /* Metrics Bar */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            text-align: center;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 8px;
        }

        .metric-value { font-size: 13px; font-weight: 700; color: var(--accent-blue); }
        .metric-label { font-size: 10px; color: #94a3b8; }

        /* Map Container */
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Bottom Action Panel */
        .action-panel {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            grid-column: span 2;
            font-size: 15px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-whatsapp { background: rgba(37, 211, 102, 0.15); border-color: rgba(37, 211, 102, 0.4); color: #25d366; }

        /* Custom Radar Pulse Marker Animation */
        .radar-icon {
            position: relative;
        }
        .radar-icon::before {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            top: -12px;
            left: -12px;
            background: rgba(56, 189, 248, 0.3);
            border: 2px solid var(--accent-blue);
            border-radius: 50%;
            animation: radar-expand 2s infinite ease-out;
        }
        .radar-core {
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        /* Toast Notification */
        #toast {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-blue);
            color: #000000;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes radar-expand {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="toast">تم نسخ رابط الموقع بنجاح!</div>

    <!-- Top HUD Header -->
    <div class="hud-header">
        <div class="brand-title">
            <h1>⚡ LADAYCIA Engineering</h1>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span id="gps-status">تتبع حقيقي</span>
            </div>
        </div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-value" id="val-accuracy">-- م</div>
                <div class="metric-label">دقة الإشارة</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="val-speed">0 كم/س</div>
                <div class="metric-label">السرعة</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="val-coords">-- , --</div>
                <div class="metric-label">الإحداثيات</div>
            </div>
        </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Bottom Actions Panel -->
    <div class="action-panel">
        <button class="btn btn-primary" onclick="openGoogleMaps()">
            📍 فتح الموقع في Google Maps Direct
        </button>
        <div class="btn-group">
            <button class="btn btn-whatsapp" onclick="shareWhatsApp()">
                💬 مشاركة عبر WhatsApp
            </button>
            <button class="btn" onclick="copyLocationLink()">
                📋 نسخ الرابط المباشر
            </button>
        </div>
        <button class="btn" style="background: rgba(15,23,42,0.9);" onclick="toggleMapLayer()">
            🗺️ تغيير نمط الخريطة (تكتيكي / أقماري)
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLat = 36.8792;
        let currentLon = 7.7516;
        let isSatellite = false;

        // خريطة النمط التكتيكي المظلم (CartoDB Dark Matter)
        const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'LADAYCIA Engineering'
        });

        // خريطة الأقمار الصناعية (Esri World Imagery)
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Esri Satellite'
        });

        // تهيئة الخريطة
        const map = L.map('map', {
            center: [currentLat, currentLon],
            zoom: 16,
            layers: [darkLayer],
            zoomControl: false
        });

        // أيقونة الرادار المتحركة
        const radarIcon = L.divIcon({
            className: 'radar-icon',
            html: '<div class="radar-core"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        let marker = L.marker([currentLat, currentLon], { icon: radarIcon }).addTo(map)
            .bindPopup("<div style='text-align:center;'><b>LADAYCIA Mobile Unit</b><br>وحدة الفحص الهندسي المتنقلة</div>");

        // تتبع الـ GPS التفاعلي الحقيقي
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    const accuracy = Math.round(pos.coords.accuracy);
                    const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

                    const newPos = new L.LatLng(currentLat, currentLon);
                    marker.setLatLng(newPos);
                    map.panTo(newPos);

                    // تحديث مؤشرات الـ HUD
                    document.getElementById('val-accuracy').innerText = `${accuracy} م`;
                    document.getElementById('val-speed').innerText = `${speed} كم/س`;
                    document.getElementById('val-coords').innerText = `${currentLat.toFixed(3)}, ${currentLon.toFixed(3)}`;
                    document.getElementById('gps-status').innerText = "متصل حي";
                },
                (err) => {
                    document.getElementById('gps-status').innerText = "خطأ بالـ GPS";
                    document.getElementById('gps-status').style.color = "var(--accent-red)";
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // الوظائف التفاعلية
        function openGoogleMaps() {
            window.open(`https://www.google.com/maps?q=${currentLat},${currentLon}`, '_blank');
        }

        function shareWhatsApp() {
            const text = `مرحباً، هذا هو موقع وحدة الفحص الهندسية المتنقلة (LADAYCIA Scan-Auto):\nhttps://www.google.com/maps?q=${currentLat},${currentLon}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function copyLocationLink() {
            const url = `https://www.google.com/maps?q=${currentLat},${currentLon}`;
            navigator.clipboard.writeText(url).then(() => {
                showToast("succuesfuly Copy !");
            });
        }

        function toggleMapLayer() {
            if (isSatellite) {
                map.removeLayer(satelliteLayer);
                map.addLayer(darkLayer);
                isSatellite = false;
            } else {
                map.removeLayer(darkLayer);
                map.addLayer(satelliteLayer);
                isSatellite = true;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }
    </script>
</body>
</html>
