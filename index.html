
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Scan Tracker</title>
    
    <!-- استدعاء مكتبة الخرائط المجانية Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS تفاعلي وديناميكي - طابع تكتيكي (Tactical HUD) */
        :root {
            --primary-glow: #00ffcc; /* لون أخضر/أزرق نيون للتقنية */
            --bg-glass: rgba(10, 15, 20, 0.85); /* خلفية زجاجية داكنة */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Courier New', Courier, monospace; /* خط برمجي احترافي */
            background-color: #000;
            overflow: hidden;
        }

        /* إعدادات الخريطة */
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* تصميم الخريطة لتصبح داكنة (Dark Mode Trick) */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* لوحة التحكم التكتيكية (HUD) */
        .hud-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: var(--bg-glass);
            border: 1px solid var(--primary-glow);
            border-radius: 8px;
            padding: 15px;
            color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(5px);
            width: 260px;
            direction: ltr; /* اتجاه الكتابة للإحداثيات */
        }

        .hud-header {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--primary-glow);
            padding-bottom: 10px;
            text-shadow: 0 0 5px var(--primary-glow);
            letter-spacing: 1px;
        }

        .hud-data {
            font-size: 0.9rem;
            line-height: 1.8;
        }

        /* لمبة التنبيه الديناميكية */
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: red;
            margin-right: 8px;
            box-shadow: 0 0 8px red;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--primary-glow);
            box-shadow: 0 0 10px var(--primary-glow);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.5; transform: scale(1.2); }
        }

        /* مؤشر الإشارة السفلي */
        .radar-scan {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            color: var(--primary-glow);
            background: var(--bg-glass);
            padding: 8px 12px;
            border: 1px solid var(--primary-glow);
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- لوحة بيانات المهندس (HUD) -->
    <div class="hud-container">
        <div class="hud-header">
            Auto Scan Tracker<br>DIAGNOSTIC SYSTEM
        </div>
        <div class="hud-data">
            <div><span class="status-dot" id="status-dot"></span><span id="status-text">INITIALIZING...</span></div>
            <hr style="border: 0.5px solid rgba(0, 255, 204, 0.3); margin: 10px 0;">
            <div>LAT : <span id="lat">SCANNING...</span></div>
            <div>LON : <span id="lon">SCANNING...</span></div>
            <div>ACC : <span id="acc">--</span> meters</div>
            <div>SPD : <span id="spd">--</span> km/h</div>
        </div>
    </div>

    <div class="radar-scan">🛰️ GPS SIGNAL: <span id="signal-str">SEARCHING...</span></div>

    <!-- حاوية الخريطة -->
    <div id="map"></div>

    <!-- استدعاء سكريبت الخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. تهيئة الخريطة (المركز الافتراضي مؤقتاً)
        var map = L.map('map', {zoomControl: false}).setView([36.7525, 3.04197], 6);

        // إضافة طبقة الخريطة المجانية (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© Auto Scan Tracker'
        }).addTo(map);

        // 2. تصميم أيقونة الهدف التكتيكية
        var tacticalIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#00ffcc; width:16px; height:16px; border-radius:50%; box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc; border: 2px solid #fff;'></div>",
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        var userMarker = null;
        var userCircle = null;

        // ربط عناصر HTML بمتغيرات الجافاسكريبت
        var elLat = document.getElementById('lat');
        var elLon = document.getElementById('lon');
        var elAcc = document.getElementById('acc');
        var elSpd = document.getElementById('spd');
        var elStatusDot = document.getElementById('status-dot');
        var elStatusText = document.getElementById('status-text');
        var elSignal = document.getElementById('signal-str');

        // 3. تتبع الموقع المباشر (Live GPS Tracking)
        if ("geolocation" in navigator) {
            elStatusText.innerText = "AWAITING SATELLITE";
            
            navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lon = position.coords.longitude;
                var acc = position.coords.accuracy;
                var speed = position.coords.speed; // السرعة بالمتر في الثانية

                // تحديث بيانات اللوحة (HUD)
                elLat.innerText = lat.toFixed(5);
                elLon.innerText = lon.toFixed(5);
                elAcc.innerText = acc.toFixed(1);
                elSpd.innerText = speed ? (speed * 3.6).toFixed(1) : "0.0"; // تحويل لـ كم/ساعة
                
                // تفعيل المظهر الديناميكي
                elStatusDot.classList.add('active');
                elStatusText.innerText = "SYSTEM ACTIVE";
                elSignal.innerText = "LOCKED";

                // تحديث الخريطة
                var newLatLng = new L.LatLng(lat, lon);
                
                if (!userMarker) {
                    // أول مرة يجد فيها الموقع: رسم النقطة والاقتراب (Zoom)
                    map.setView(newLatLng, 16);
                    userMarker = L.marker(newLatLng, {icon: tacticalIcon}).addTo(map);
                    userCircle = L.circle(newLatLng, {
                        color: '#00ffcc',
                        fillColor: '#00ffcc',
                        fillOpacity: 0.15,
                        radius: acc
                    }).addTo(map);
                } else {
                    // تحديث الموقع أثناء التحرك
                    userMarker.setLatLng(newLatLng);
                    userCircle.setLatLng(newLatLng);
                    userCircle.setRadius(acc);
                    map.panTo(newLatLng);
                }

            }, function(error) {
                elStatusText.innerText = "GPS ERROR";
                elStatusDot.classList.remove('active');
                elStatusDot.style.backgroundColor = "red";
                elSignal.innerText = "LOST";
                console.error(error);
            }, {
                enableHighAccuracy: true, /* تفعيل الدقة العالية */
                maximumAge: 0,
                timeout: 10000
            });
        } else {
            elStatusText.innerText = "NOT SUPPORTED";
        }
    </script>
</body>
</html>
