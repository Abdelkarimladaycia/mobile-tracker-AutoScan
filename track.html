<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع المهندس - Auto Scan Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        :root { --primary-glow: #00ffcc; --bg-glass: rgba(10, 15, 20, 0.90); }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Courier New', Courier, monospace; background-color: #0a0f14; overflow: hidden; color: var(--primary-glow); }
        #map { height: 100vh; width: 100vw; z-index: 1; position: absolute; top: 0; left: 0; background-color: #0a0f14; }
        .hud-container { position: absolute; top: 15px; right: 15px; left: 15px; max-width: 320px; margin: 0 auto; z-index: 999; background: var(--bg-glass); border: 1px solid var(--primary-glow); border-radius: 8px; padding: 12px 15px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); backdrop-filter: blur(8px); direction: ltr; text-align: center; }
        .hud-header { font-size: 1rem; font-weight: bold; margin-bottom: 8px; border-bottom: 1px dashed var(--primary-glow); padding-bottom: 6px; text-shadow: 0 0 5px var(--primary-glow); }
        .radar-scan { position: absolute; bottom: 20px; left: 15px; right: 15px; max-width: 320px; margin: 0 auto; z-index: 999; background: var(--bg-glass); padding: 10px; border: 1px solid var(--primary-glow); border-radius: 5px; font-weight: bold; font-size: 0.85rem; text-align: center; backdrop-filter: blur(8px); }
    </style>
</head>
<body>
    <div class="hud-container">
        <div class="hud-header">LIVE TRACKING<br>AUTO SCAN ENGINEER</div>
        <div style="font-size: 0.85rem;" id="status-msg">جاري تتبع تحرك المهندس نحو موقعك...</div>
    </div>
    
    <div class="radar-scan" id="distance-info">🛰️ بانتظار إشارة تحرك المهندس...</div>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- استقبال موقع المهندس لحظياً -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBV52oK7kZvxsnH_zrXg3Etp6B96hZwC7U",
            authDomain: "autoscan-95c2a.firebaseapp.com",
            databaseURL: "https://autoscan-95c2a-default-rtdb.firebaseio.com",
            projectId: "autoscan-95c2a",
            storageBucket: "autoscan-95c2a.firebasestorage.app",
            messagingSenderId: "883216178444",
            appId: "1:883216178444:web:83746233e9e6ec2862fd29"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        var map = L.map('map', {zoomControl: false}).setView([36.7525, 3.04197], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        var engIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#ff3333; width:18px; height:18px; border-radius:50%; box-shadow: 0 0 15px #ff3333; border: 2px solid #fff;' title='المهندس'></div>",
            iconSize: [18, 18], iconAnchor: [9, 9]
        });

        var engMarker = null;

        onValue(ref(db, 'engineerLocation'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                var lat = data.lat;
                var lon = data.lon;
                var latLng = new L.LatLng(lat, lon);

                document.getElementById('status-msg').innerText = "المهندس في الطريق إليك حالياً ✓";
                document.getElementById('distance-info').innerText = `📍 موقع المهندس المباشر محدث`;

                if (!engMarker) {
                    map.setView(latLng, 16);
                    engMarker = L.marker(latLng, {icon: engIcon}).addTo(map);
                } else {
                    engMarker.setLatLng(latLng);
                    map.panTo(latLng);
                }
            }
        });
    </script>
</body>
</html>
